<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada pesan buat kamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a1b3d;
    --bg: #e9e1f7;
    --paper: #fffdf8;
    --rose: #e8477a;
    --rose-dark: #c2305f;
    --butter: #ffe9a8;
    --muted: #6b5c80;
  }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: grid;
    place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    min-height: 100%;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border-radius: 18px;
    padding: 32px 24px 28px;
    box-shadow: 0 2px 0 var(--butter), 0 18px 40px rgba(42, 27, 61, .18);
    text-align: center;
    position: relative;
  }
  .screen { display: none; }
  .screen.active { display: block; animation: pop .35s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  h1 {
    font-family: "Caveat", "Comic Sans MS", cursive;
    font-size: 2.6rem;
    line-height: 1.05;
    margin-bottom: 14px;
  }
  p { line-height: 1.6; color: var(--muted); margin-bottom: 22px; }
  .big { font-size: 1.05rem; color: var(--ink); }
  .emoji { font-size: 3.2rem; display: block; margin-bottom: 10px; }

  button, .btn {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 999px;
    padding: 14px 26px;
    min-height: 48px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    touch-action: manipulation;
  }
  .yes { background: var(--rose); color: #fff; font-size: 1.05rem; transition: transform .15s; }
  .yes:active { background: var(--rose-dark); }
  .no { background: transparent; color: var(--muted); border: 2px solid #d8cfe8; }
  .row { display: flex; gap: 12px; justify-content: center; align-items: center; min-height: 110px; }
  .no.run { position: fixed; z-index: 5; transition: left .18s, top .18s; }
  button:focus-visible, .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .hint { font-size: .85rem; min-height: 1.3em; margin: 6px 0 0; }


  .love { font-family: "Caveat", "Comic Sans MS", cursive; font-size: 5rem; line-height: 1; color: var(--rose); margin: -6px 0 18px; }
  .love span { font-size: 2.4rem; }
  .bars { list-style: none; padding: 0; display: grid; gap: 12px; text-align: left; font-size: .9rem; margin-bottom: 16px; }
  .bars li { display: grid; gap: 4px; }
  .bars .top { display: flex; justify-content: space-between; gap: 10px; }
  .bars .track { height: 10px; background: #eee6f7; border-radius: 99px; overflow: hidden; }
  .bars i { display: block; height: 100%; width: 0; background: var(--rose); transition: width 1.1s ease-out; }
  .verdict { font-size: .88rem; margin-bottom: 20px; }
  #form-error { color: var(--rose-dark); margin: 4px 0 14px; }
  label { display: block; text-align: left; font-weight: 700; margin: 16px 0 6px; }
  label b { color: var(--rose); float: right; }
  input[type=text] { width: 100%; font: inherit; padding: 12px 14px; border: 2px solid #d8cfe8; border-radius: 12px; background: #fff; color: var(--ink); }
  input[type=range] { width: 100%; accent-color: var(--rose); min-height: 32px; }

  .heart {
    position: fixed; bottom: -40px; font-size: 1.6rem; pointer-events: none;
    animation: rise linear forwards; z-index: 10;
  }
  @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: .2; } }

  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation: none; }
    .bars i { transition: none; }
    .heart { display: none; }
    .no.run { transition: none; }
  }
</style>
</head>
<body>
<main class="card">

  <!-- Layar 1: amplop -->
  <section class="screen active" id="s1">
    <span class="emoji">💌</span>
    <h1>Hai, <span class="nama"></span>.</h1>
    <p>Ada pesan kecil yang pengin aku sampaikan ke kamu.</p>
    <button class="yes" id="open">Buka pesan</button>
  </section>

  <!-- Layar 2: pertanyaan -->
  <section class="screen" id="s2">
    <h1>Jujur ya, <span class="nama"></span>...</h1>
    <p class="big" id="isi"></p>
    <div class="row" id="row">
      <button class="yes" id="yes">Mau 💖</button>
      <button class="no" id="no">Nggak</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <!-- Layar 3: selamat + statistik cinta -->
  <section class="screen" id="s3">
    <span class="emoji">🎉</span>
    <h1>Yeay, selamat!</h1>
    <p class="big">Kamu resmi dapet cinta dari aku:</p>
    <div class="love"><b id="love-num">0</b><span>%</span></div>
    <ul class="bars" id="bars"></ul>
    <p class="verdict" id="verdict"></p>
    <button class="yes" id="to-form">Isi data kamu dulu 💌</button>
  </section>

  <!-- Layar 4: formulir -->
  <section class="screen" id="s4">
    <h1>Giliran kamu</h1>
    <p>Isi dulu ya, biar datanya lengkap.</p>
    <label for="sayang">Seberapa sayang kamu ke aku? <b id="sayang-val">50%</b></label>
    <input type="range" id="sayang" min="0" max="100" value="50">
    <p class="hint" id="sayang-teks"></p>
    <label for="panggilan">Panggilan sayang buat aku</label>
    <input type="text" id="panggilan" maxlength="30" placeholder="misalnya: bub">
    <p class="hint" id="form-error"></p>
    <button class="yes" id="kirim">Kirim jawabanku 💖</button>
  </section>

  <!-- Layar 5: terkirim -->
  <section class="screen" id="s5">
    <span class="emoji">🥰</span>
    <h1>Terkirim!</h1>
    <p class="big" id="hasil"></p>
    <a class="btn yes" id="wa" target="_blank" rel="noopener">Balas lewat WhatsApp</a>
  </section>

</main>

<script>
  // ====== UBAH BAGIAN INI ======
  const NAMA_GEBETAN = "Sayang";            // nama / panggilan dia
  const NAMA_KAMU    = "Aku";               // namamu
  const NOMOR_WA     = "6281234567890";     // format 62..., tanpa + dan tanpa 0 di depan
  const PESAN = "Sejak kenal kamu, hari-hariku jadi lebih seru. Aku suka ngobrol sama kamu, dan aku pengin lebih dari sekadar teman. Kamu mau jadi pacarku?";
  const BALASAN_WA = "Aku mau! 💖";
  const KETERANGAN_NO = [
    "Eh, tombolnya kabur.",
    "Coba lagi deh.",
    "Yakin? Pikir-pikir dulu.",
    "Tombol Mau lebih gampang diklik lho.",
    "Udah, nyerah aja ya 😄"
  ];
  // =============================

  const $ = id => document.getElementById(id);

  // Pencatat kejadian: dikirim ke server tanpa mengganggu tampilan
  const SESSION = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random();
  function track(type) {
    try {
      const data = JSON.stringify({ session: SESSION, type });
      if (!(navigator.sendBeacon && navigator.sendBeacon("/api/event", data))) {
        fetch("/api/event", { method: "POST", body: data, keepalive: true });
      }
    } catch (e) { /* abaikan, halaman tetap jalan */ }
  }
  function trackAsync(type) {
    return fetch("/api/event", { method: "POST", body: JSON.stringify({ session: SESSION, type }), keepalive: true }).catch(() => {});
  }
  track("open_page");

  function fmtDur(s) {
    if (s == null) return "-";
    return s < 60 ? s + " detik" : Math.floor(s / 60) + " menit " + (s % 60) + " detik";
  }
  function verdict(n) {
    if (n === 0) return "Tanpa ragu sedikit pun. Aku tersanjung 🥰";
    if (n <= 3)  return "Sempat ragu sebentar, tapi akhirnya kamu jujur sama hati.";
    if (n <= 8)  return "Lumayan gigih mengejar tombol itu, tapi hatimu lebih cepat.";
    return "Kamu mengejar tombol itu sampai capek. Untung hatimu menang 😂";
  }
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ROWS = [["🛡️ Kesetiaan", 100], ["🤗 Perhatian", 100], ["⏳ Sabar nunggu balasanmu", 99], ["🍜 Siap traktir", 87]];

  function playLove() {
    const ul = $("bars");
    ul.innerHTML = "";
    ROWS.forEach(([label, pct]) => {
      const li = document.createElement("li");
      const top = document.createElement("div"); top.className = "top";
      const a = document.createElement("span"); a.textContent = label;
      const b = document.createElement("b"); b.textContent = pct + "%";
      top.append(a, b);
      const track = document.createElement("div"); track.className = "track";
      const bar = document.createElement("i"); bar.dataset.pct = pct;
      track.appendChild(bar);
      li.append(top, track);
      ul.appendChild(li);
    });
    const num = $("love-num"), start = performance.now(), dur = REDUCE ? 1 : 1400;
    (function tick(now) {
      const t = Math.min((now - start) / dur, 1);
      num.textContent = Math.round(t * 100);
      if (t < 1) requestAnimationFrame(tick);
    })(start);
    setTimeout(() => ul.querySelectorAll("i").forEach(i => i.style.width = i.dataset.pct + "%"), 200);
  }

  async function loadVerdict() {
    try {
      const d = await (await fetch("/api/kamu?session=" + encodeURIComponent(SESSION))).json();
      const mikir = d.waktu_mikir_detik != null ? "Kamu mikir " + fmtDur(d.waktu_mikir_detik) + " dan mencoba " : "Kamu mencoba ";
      $("verdict").textContent = mikir + 'menekan "Nggak" ' + d.coba_nggak + " kali. " + verdict(d.coba_nggak);
    } catch (e) { /* tanpa server, kalimat ini dilewati */ }
  }

  function sayangTeks(v) {
    if (v < 30) return "Masih malu-malu ya 😳";
    if (v < 60) return "Lumayan, bisa naik lagi lho.";
    if (v < 90) return "Aww, makin manis 🥺";
    if (v < 100) return "Dikit lagi penuh!";
    return "PENUH! Sama kayak punyaku 💯";
  }
  const sayang = $("sayang");
  function updSayang() {
    $("sayang-val").textContent = sayang.value + "%";
    $("sayang-teks").textContent = sayangTeks(+sayang.value);
  }
  sayang.addEventListener("input", updSayang);
  updSayang();
  // Penjaga: sebelum jawaban terkirim, browser menanyakan dulu kalau dia mau keluar
  let wajib = false, selesai = false;
  const simpan = v => { try { localStorage.setItem("gebetan_state", v); } catch (e) {} };
  function startGuard() {
    wajib = true;
    simpan("yes");
    history.pushState({ g: 1 }, "");
  }
  window.addEventListener("popstate", () => { if (wajib && !selesai) history.pushState({ g: 1 }, ""); });
  window.addEventListener("beforeunload", e => { if (wajib && !selesai) { e.preventDefault(); e.returnValue = ""; } });

  $("to-form").addEventListener("click", () => show("s4"));
  $("kirim").addEventListener("click", async () => {
    const v = +sayang.value;
    const panggilan = $("panggilan").value.trim().slice(0, 30);
    if (!panggilan) {
      $("form-error").textContent = "Isi panggilan sayangnya dulu ya 😊";
      $("panggilan").focus();
      return;
    }
    $("form-error").textContent = "";
    try {
      await fetch("/api/jawab", { method: "POST", body: JSON.stringify({ session: SESSION, sayang: v, panggilan }), keepalive: true });
    } catch (e) { /* tetap lanjut walau server bermasalah */ }
    let teks = v >= 100 ? "Sayangmu penuh 100%. Cocok banget sama punyaku!" : "Sayangmu " + v + "%. Tenang, nanti kubantu naikin sampai penuh 😌";
    if (panggilan) teks += ' Dan mulai sekarang aku resmi dipanggil "' + panggilan + '". Siap!';
    $("hasil").textContent = teks;
    $("wa").href = "https://wa.me/" + NOMOR_WA + "?text=" + encodeURIComponent(BALASAN_WA + " Sayangku buat kamu " + v + "%");
    selesai = true;
    simpan("done");
    show("s5");
  });

  document.querySelectorAll(".nama").forEach(el => el.textContent = NAMA_GEBETAN);
  $("isi").textContent = PESAN;
  $("wa").href = `https://wa.me/${NOMOR_WA}?text=${encodeURIComponent(BALASAN_WA + " - " + NAMA_KAMU)}`;

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  $("open").addEventListener("click", () => { track("open_letter"); show("s2"); });

  // Tombol "Nggak" menghindar, tombol "Mau" makin besar
  let tries = 0, lastDodge = 0;
  const no = $("no"), yes = $("yes");

  function dodge(e) {
    e.preventDefault();
    const now = Date.now();
    if (now - lastDodge < 400) return; // satu sentuhan = satu hitungan
    lastDodge = now;
    tries++;
    track("no_try");
    no.classList.add("run");
    const w = no.offsetWidth, h = no.offsetHeight, m = 12;
    no.style.left = m + Math.random() * (window.innerWidth - w - 2 * m) + "px";
    no.style.top  = m + Math.random() * (window.innerHeight - h - 2 * m) + "px";
    yes.style.transform = `scale(${Math.min(1 + tries * 0.12, 1.8)})`;
    $("hint").textContent = KETERANGAN_NO[Math.min(tries - 1, KETERANGAN_NO.length - 1)];
  }
  no.addEventListener("pointerdown", dodge);
  no.addEventListener("click", dodge);
  no.addEventListener("mouseenter", e => { if (matchMedia("(hover: hover)").matches) dodge(e); });

  yes.addEventListener("click", () => {
    trackAsync("yes").then(loadVerdict);
    no.classList.remove("run");
    show("s3");
    playLove();
    startGuard();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const icons = ["💖", "💗", "💕", "✨", "🌸"];
    for (let i = 0; i < 40; i++) {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = icons[i % icons.length];
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
      h.style.animationDelay = Math.random() * 1.2 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }
  });

  // Lanjutkan dari tempat terakhir kalau halaman dibuka lagi. Tambahkan ?reset di alamat untuk mengulang dari awal (saat kamu tes).
  try {
    if (location.search.includes("reset")) localStorage.removeItem("gebetan_state");
    const st = localStorage.getItem("gebetan_state");
    if (st === "yes") { wajib = true; history.pushState({ g: 1 }, ""); show("s4"); }
    else if (st === "done") { selesai = true; $("hasil").textContent = "Jawabanmu sudah terkirim. Makasih ya 🥰"; show("s5"); }
  } catch (e) { /* abaikan */ }
</script>
</body>
</html>
